<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;display=swap');
      .title-text { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 52px; fill: #F5E6C8; text-anchor: middle; dominant-baseline: central; }
      .sub-text { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 14px; fill: #C9A84C; text-anchor: middle; dominant-baseline: central; letter-spacing: 6px; }
      .cycle-text { font-family: 'Instrument Serif', 'Georgia', serif; font-size: 10px; fill: #8B7355; text-anchor: middle; dominant-baseline: central; letter-spacing: 3px; }
      .char-small { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 11px; fill: #C9A84C; text-anchor: middle; dominant-baseline: central; opacity: 0.7; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="180" rx="12" fill="#1A1A2E"/>

  <!-- Subtle top and bottom border lines -->
  <line x1="40" y1="20" x2="560" y2="20" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>
  <line x1="40" y1="160" x2="560" y2="160" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>

  <!-- Decorative side elements -->
  <line x1="40" y1="20" x2="40" y2="160" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>
  <line x1="560" y1="20" x2="560" y2="160" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>

  <!-- Vermilion accent dot -->
  <circle cx="50" cy="90" r="3" fill="#C23B22"/>
  <circle cx="550" cy="90" r="3" fill="#C23B22"/>

  <!-- Divider line -->
  <line x1="70" y1="90" x2="530" y2="90" stroke="#C9A84C" stroke-width="0.3" opacity="0.15"/>

  <!-- Decorative left glyph column -->
  <text x="80" y="60" class="char-small" opacity="0.3">辰</text>
  <text x="80" y="80" class="char-small" opacity="0.2">巳</text>
  <text x="80" y="100" class="char-small" opacity="0.2">午</text>
  <text x="80" y="120" class="char-small" opacity="0.3">未</text>

  <!-- Decorative right glyph column -->
  <text x="520" y="60" class="char-small" opacity="0.3">寅</text>
  <text x="520" y="80" class="char-small" opacity="0.2">卯</text>
  <text x="520" y="100" class="char-small" opacity="0.2">戌</text>
  <text x="520" y="120" class="char-small" opacity="0.3">亥</text>

  <!-- Center divider -->
  <line x1="295" y1="35" x2="295" y2="145" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>

  <!-- Left section: Icon motif -->
  <circle cx="150" cy="90" r="38" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
  <circle cx="150" cy="90" r="24" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>
  <text x="150" y="84" class="sub-text" font-size="16">生肖</text>
  <text x="150" y="100" class="sub-text" font-size="11" letter-spacing="2">计算</text>

  <!-- Small zodiac ring around icon -->
  <text x="134" y="64" class="char-small" font-size="8" opacity="0.5">鼠</text>
  <text x="166" y="64" class="char-small" font-size="8" opacity="0.5">牛</text>
  <text x="176" y="90" class="char-small" font-size="8" opacity="0.5">虎</text>
  <text x="166" y="116" class="char-small" font-size="8" opacity="0.5">兔</text>
  <text x="134" y="116" class="char-small" font-size="8" opacity="0.5">龙</text>
  <text x="124" y="90" class="char-small" font-size="8" opacity="0.5">蛇</text>

  <!-- Right section: Title -->
  <text x="400" y="78" class="title-text">生肖计算器</text>
  <text x="400" y="108" class="cycle-text">CHINESE ZODIAC CALCULATOR</text>

  <!-- Bottom decorative wave (subtle) -->
  <path d="M 100 152 Q 120 146 140 152 Q 160 158 180 152 Q 200 146 220 152 Q 240 158 260 152 Q 280 146 300 152 Q 320 158 340 152 Q 360 146 380 152 Q 400 158 420 152 Q 440 146 460 152 Q 480 158 500 152" fill="none" stroke="#C9A84C" stroke-width="0.3" opacity="0.15"/>
</svg>
