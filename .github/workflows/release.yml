name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libgtk-3-dev

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          - os: macos-latest
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME="demo"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH="arm64-apple"
          elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            ARCH="x86_64-apple"
          else
            ARCH="x86_64-linux"
          fi
          ARCHIVE_NAME="zodiac-calculator-${ARCH}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" .
          tar czf "${ARCHIVE_NAME}" "${BINARY_NAME}"
          echo "archive=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "zodiac-calculator-x86_64-windows.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/demo.exe" -DestinationPath $ARCHIVE_NAME
          echo "archive=$ARCHIVE_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zodiac-calculator-*.tar.gz
            zodiac-calculator-*.zip
          generate_release_notes: true
