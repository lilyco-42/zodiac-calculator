name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libgtk-3-dev

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          - os: macos-latest
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "target/${{ matrix.target }}/release/demo" .
          tar czf "zodiac-calculator-x86_64-linux.tar.gz" demo

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          BINARY="target/${{ matrix.target }}/release/demo"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCHIVE="zodiac-calculator-arm64-macos.tar.gz"
          else
            ARCHIVE="zodiac-calculator-x86_64-macos.tar.gz"
          fi
          cp "$BINARY" .
          tar czf "$ARCHIVE" demo

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/demo.exe" -DestinationPath "zodiac-calculator-x86_64-windows.zip"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zodiac-calculator-*.tar.gz
            zodiac-calculator-*.zip

  android:
    name: aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native library
        run: cargo ndk -t arm64-v8a build --release

      - name: Package
        run: |
          mkdir -p android-output/jni/arm64-v8a
          cp target/aarch64-linux-android/release/libdemo.so android-output/jni/arm64-v8a/
          cd android-output && zip -r ../zodiac-calculator-arm64-android.zip ./*

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: zodiac-calculator-arm64-android.zip
