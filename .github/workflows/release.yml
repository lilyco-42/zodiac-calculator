name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libgtk-3-dev

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          - os: macos-latest
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "target/${{ matrix.target }}/release/demo" .
          tar czf "zodiac-calculator-x86_64-linux.tar.gz" demo

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          BINARY="target/${{ matrix.target }}/release/demo"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCHIVE="zodiac-calculator-arm64-macos.tar.gz"
          else
            ARCHIVE="zodiac-calculator-x86_64-macos.tar.gz"
          fi
          cp "$BINARY" .
          tar czf "$ARCHIVE" demo

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/demo.exe" -DestinationPath "zodiac-calculator-x86_64-windows.zip"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zodiac-calculator-*.tar.gz
            zodiac-calculator-*.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms
        run: yes | sdkmanager "platforms;android-30" "platforms;android-34" 2>&1 | tail -5

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK
        run: cargo apk build --release
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate and rename APK
        run: |
          APK=$(find target -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" zodiac-calculator-arm64.apk
            echo "APK found at: $APK"
          else
            echo "No APK found in target/"
            ls -la target/ 2>/dev/null || echo "No target dir"
            find target -type f 2>/dev/null | head -50
            exit 1
          fi

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: zodiac-calculator-arm64.apk
