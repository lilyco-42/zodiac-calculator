<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;display=swap');
      .zodiac-text { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 15px; fill: #C9A84C; text-anchor: middle; dominant-baseline: central; }
      .center-text { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 42px; fill: #F5E6C8; text-anchor: middle; dominant-baseline: central; }
      .subtitle-text { font-family: 'Noto Serif SC', 'Microsoft YaHei', 'SimSun', serif; font-size: 12px; fill: #C9A84C; text-anchor: middle; dominant-baseline: central; letter-spacing: 4px; }
      .label-text { font-family: 'Instrument Serif', 'Georgia', serif; font-size: 7px; fill: #8B7355; text-anchor: middle; dominant-baseline: central; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Shadow -->
  <circle cx="130" cy="130" r="126" fill="rgba(0,0,0,0.3)"/>

  <!-- Outer circle background -->
  <circle cx="128" cy="128" r="124" fill="#1A1A2E" stroke="#C9A84C" stroke-width="2.5"/>

  <!-- Decorative outer ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>

  <!-- Inner ring boundary -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>

  <!-- Innermost circle background -->
  <circle cx="128" cy="128" r="52" fill="#16213E" stroke="#C9A84C" stroke-width="0.8" opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="128" cy="128" r="2" fill="#C9A84C" opacity="0.5"/>

  <!-- Divider lines from center to zodiac positions (subtle) -->
  <line x1="128" y1="76" x2="128" y2="96" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>
  <line x1="128" y1="160" x2="128" y2="180" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>
  <line x1="76" y1="128" x2="96" y2="128" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>
  <line x1="160" y1="128" x2="180" y2="128" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>

  <!-- Cardinal decorative dots -->
  <circle cx="128" cy="28" r="2.5" fill="#C23B22"/>
  <circle cx="128" cy="228" r="2.5" fill="#C23B22"/>
  <circle cx="28" cy="128" r="2.5" fill="#C23B22"/>
  <circle cx="228" cy="128" r="2.5" fill="#C23B22"/>

  <!-- Zodiac characters on inner ring (r=65, upright) -->
  <text x="128" y="67" class="zodiac-text">鼠</text>
  <text x="160.5" y="73.2" class="zodiac-text">牛</text>
  <text x="184.3" y="93" class="zodiac-text">虎</text>
  <text x="193" y="128" class="zodiac-text">兔</text>
  <text x="184.3" y="163" class="zodiac-text">龙</text>
  <text x="160.5" y="182.8" class="zodiac-text">蛇</text>
  <text x="128" y="189" class="zodiac-text">马</text>
  <text x="95.5" y="182.8" class="zodiac-text">羊</text>
  <text x="71.7" y="163" class="zodiac-text">猴</text>
  <text x="63" y="128" class="zodiac-text">鸡</text>
  <text x="71.7" y="93" class="zodiac-text">狗</text>
  <text x="95.5" y="73.2" class="zodiac-text">猪</text>

  <!-- Center content: 生肖 -->
  <text x="128" y="118" class="center-text">生</text>
  <text x="128" y="148" class="center-text">肖</text>

  <!-- Label at bottom of inner ring -->
  <text x="128" y="228" class="label-text">ZODIAC</text>
  <text x="128" y="237" class="label-text">CALCULATOR</text>

  <!-- Year markers on outer ring -->
  <circle cx="128" cy="44" r="1" fill="#C9A84C" opacity="0.5"/>
  <circle cx="128" cy="212" r="1" fill="#C9A84C" opacity="0.5"/>
  <circle cx="44" cy="128" r="1" fill="#C9A84C" opacity="0.5"/>
  <circle cx="212" cy="128" r="1" fill="#C9A84C" opacity="0.5"/>
</svg>
